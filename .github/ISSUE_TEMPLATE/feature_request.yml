name: Feature request
description: Suggest an improvement for MiraFolio for Windows
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Checklist
      options:
        - label: This request applies to the Windows desktop application.
          required: true
        - label: I searched existing issues.
          required: true
