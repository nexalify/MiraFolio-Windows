name: Bug report
description: Report reproducible incorrect behavior in MiraFolio for Windows
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please redact local paths, monitor identifiers, logs, and screenshots before submitting.
  - type: input
    id: version
    attributes:
      label: MiraFolio version
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: monitors
    attributes:
      label: Display setup
      description: Number of displays, resolutions, orientation, and scaling. Do not include device IDs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only the relevant section from mirafolio.log after removing personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed personal file paths and identifiers.
          required: true
