name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Windows build, test, and publish
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore dependencies
        run: dotnet restore MiraFolio.sln -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build
        run: dotnet build MiraFolio.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test src/MiraFolio.Tests/MiraFolio.Tests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Verify self-contained publish
        run: >-
          dotnet publish src/MiraFolio.App/MiraFolio.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=0.0.0-ci
          -o artifacts/ci-publish

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7
